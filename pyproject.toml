[project]
name = "discoverylab"
version = "0.1.0"
description = "Multi-agent scientific discovery lab: Director, Literature, Hypothesis, Experiment and Critic agents with independent citation verification and process evaluation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "anthropic>=1.12",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.scripts]
discoverylab = "discoverylab.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-pyyaml>=6.0",
  "playwright==1.56.0",
  "matplotlib>=3.9",
  "httpx>=0.28.1",
]

local = [
  "llama-cpp-python==0.3.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discoverylab"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["N803", "N806", "E501"]

[tool.ruff.lint.per-file-ignores]
"src/discoverylab/text.py" = ["RUF001"]
"tests/test_core.py" = ["RUF001"]  # deliberate Unicode dashes and quotes to normalise

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["discoverylab"]
plugins = ["pydantic.mypy"]
warn_return_any = false

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "matplotlib.*", "llama_cpp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ui: browser tests (need built frontend + chromium)"]
addopts = "-m 'not ui'"
