# E1: end-to-end runs. Retrieval is recorded to cache/ so E2-E5 can replay it offline.
cache_mode: record
sources: [openalex, crossref, arxiv, semanticscholar]
questions:
  - configs/questions/q1_calibration.yaml
  - configs/questions/q2_scaling_knn.yaml
  - configs/questions/q3_imbalance.yaml
reasoners:
  - {reasoner: rule, repeats: 1}           # deterministic baseline; one run is the run
  - {reasoner: local, repeats: 3}          # open-weights model on the CPU (D17); output varies by seed
  - {reasoner: local, model_critic: local, repeats: 3}
  - {reasoner: local-b5, repeats: 3}       # ablation: 5 records per evidence call instead of all 25 (D18)
  - {reasoner: claude, repeats: 3}         # needs ANTHROPIC_API_KEY; recorded as skipped without it
  - {reasoner: claude, model_critic: claude, repeats: 3}
run_config: {per_source: 10, max_papers: 25, max_hypotheses: 2, critique_rounds: 2}
judge: local    # hypothesis rubric and quote support, by a different model family (DISCOVERYLAB_LOCAL_JUDGE)
# Adopt the completed runs of these earlier E1 results (same run_config, sources, judge and cache mode)
# instead of rerunning them; an interrupted result's checkpoint counts (D18). Only missing arms run.
# Delete these lines to rerun every arm from scratch.
reuse_from: [20261009T125639Z-003a145, 20261009T210610Z-1901a9c]
